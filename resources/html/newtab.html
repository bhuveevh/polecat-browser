<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    color: #14261f; overflow: hidden;
  }
  body.dark { color: #eaf2ff; }

  /* ---- wallpaper ---- */
  /* A gradient stands in if the SVG ever fails, so the page is never blank. */
  #wall {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(160deg, #cfe9e0 0%, #a9d3bd 45%, #6fa583 100%);
  }
  body.dark #wall {
    background: linear-gradient(160deg, #1d3040 0%, #16283a 45%, #101f2e 100%);
  }
  #wall svg { width: 100%; height: 100%; display: block; }
  #wall svg > g.dark { display: none !important; }
  body.dark #wall svg > *:not(g.dark) { display: none !important; }
  body.dark #wall svg > g.dark { display: inline !important; }

  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.10) 45%, rgba(255,255,255,.34));
  }
  body.dark .scrim {
    background: linear-gradient(180deg, rgba(6,16,28,.52), rgba(6,16,28,.22) 45%, rgba(6,16,28,.5));
  }

  /* ---- content ---- */
  .stage {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 46px 22px 30px; gap: 16px;
  }
  .clock { font-size: clamp(48px, 9vw, 96px); font-weight: 700; letter-spacing: -2px;
           line-height: 1; text-shadow: 0 2px 18px rgba(0,0,0,.18); }
  .date { font-size: 14px; opacity: .78; margin-top: 4px; letter-spacing: .3px; }
  .welcome { font-size: 15px; opacity: .85; }

  form.searchbar { width: min(660px, 92vw); }
  .pill {
    display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px;
    border-radius: 27px; background: rgba(255,255,255,.86);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow: 0 6px 24px rgba(0,0,0,.14);
    backdrop-filter: blur(8px);
  }
  body.dark .pill { background: rgba(24,32,44,.72); border-color: rgba(255,255,255,.12); }
  .pill:focus-within { box-shadow: 0 8px 28px rgba(0,0,0,.22); }
  .pill svg { width: 20px; height: 20px; flex: 0 0 auto; opacity: .6; fill: currentColor; }
  .pill input {
    flex: 1; height: 100%; border: 0; outline: 0; background: transparent;
    color: inherit; font-size: 16px;
  }
  .pill input::placeholder { color: currentColor; opacity: .55; }

  /* ---- bookmarks ---- */
  .panel {
    width: min(940px, 94vw); border-radius: 18px; padding: 14px 16px 10px;
    background: rgba(255,255,255,.60); border: 1px solid rgba(255,255,255,.55);
    box-shadow: 0 6px 22px rgba(0,0,0,.10);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column; min-height: 0;
  }
  body.dark .panel { background: rgba(20,28,40,.58); border-color: rgba(255,255,255,.10); }
  .panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .8px;
    text-transform: uppercase; opacity: .65;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 8px; overflow-y: auto; padding: 2px 4px 8px; max-height: 32vh;
  }
  .grid::-webkit-scrollbar { width: 8px; }
  .grid::-webkit-scrollbar-thumb { background: rgba(0,0,0,.22); border-radius: 4px; }
  body.dark .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }
  a.bm {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 12px 6px; border-radius: 12px; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.55); border: 1px solid transparent;
    font-size: 11.5px; text-align: center; line-height: 1.25;
    transition: background .12s, border-color .12s, transform .12s;
  }
  body.dark a.bm { background: rgba(255,255,255,.07); }
  a.bm:hover { background: rgba(255,255,255,.85); border-color: rgba(0,0,0,.08); transform: translateY(-1px); }
  body.dark a.bm:hover { background: rgba(255,255,255,.14); }
  a.bm .fav {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: #fff; overflow: hidden; flex: 0 0 auto;
  }
  a.bm .fav img { width: 22px; height: 22px; }
  a.bm .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { font-size: 13px; opacity: .6; padding: 6px 2px 12px; }

  /* ---- rss ---- */
  .rss .placeholder { font-size: 13px; opacity: .6; padding: 4px 2px 10px; }

  .foot { font-size: 11px; opacity: .55; margin-top: auto; text-align: center; }
</style>
</head>
<body>
<div id="wall">__POLECAT_WALLPAPER__</div>
<div class="scrim"></div>

<div class="stage">
  <div style="text-align:center">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="welcome" id="welcome">Welcome</div>

  <form class="searchbar" onsubmit="go(event)">
    <label class="pill">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="text" autofocus
             placeholder="Search anything with Polecat Browser…  Type Here"
             aria-label="Search or enter a web address">
    </label>
  </form>

  <section class="panel" style="flex:0 1 auto">
    <h2>Bookmarks</h2>
    <div class="grid" id="bookmarks"></div>
  </section>

  <section class="panel rss" style="flex:0 0 auto">
    <h2>Feeds</h2>
    <div class="placeholder" id="rss">RSS / Atom feeds will appear here.</div>
  </section>

  <p class="foot">Polecat Browser &middot; your bookmarks never leave this device</p>
</div>

<script>
  var USER = __POLECAT_USER__;
  var BOOKMARKS = __POLECAT_BOOKMARKS__;
  var DARK = __POLECAT_DARK__;
  if (DARK) document.body.classList.add('dark');

  document.getElementById('welcome').textContent =
      USER ? ('Welcome, ' + USER) : 'Welcome';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    try {
      document.getElementById('date').textContent =
          d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    } catch (e) {
      document.getElementById('date').textContent = d.toDateString();
    }
  }
  tick(); setInterval(tick, 1000);

  // --- bookmarks grid -----------------------------------------------------
  var COLORS = ['#3d78b8','#d88a24','#2e7d32','#c62828','#6a1b9a','#00838f','#4e342e','#37474f'];
  function colorFor(s) {
    var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

  var box = document.getElementById('bookmarks');
  if (!BOOKMARKS || !BOOKMARKS.length) {
    box.innerHTML = '<div class="empty">No bookmarks yet. Use the star in the toolbar to add one.</div>';
  } else {
    BOOKMARKS.forEach(function (b) {
      var a = document.createElement('a');
      a.className = 'bm'; a.href = b.url; a.title = b.title + '\n' + b.url;
      var fav = document.createElement('div');
      fav.className = 'fav';
      fav.style.background = colorFor(host(b.url));
      fav.textContent = (b.title || host(b.url)).charAt(0).toUpperCase();
      if (b.favicon) {
        var img = document.createElement('img');
        img.src = b.favicon;
        img.onload = function () { fav.textContent = ''; fav.appendChild(img); };
      }
      var t = document.createElement('div');
      t.className = 't'; t.textContent = b.title || host(b.url);
      a.appendChild(fav); a.appendChild(t);
      box.appendChild(a);
    });
  }

  function go(e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    var looksLikeUrl = /^(https?:\/\/|about:|file:|ftp:)/i.test(v) ||
                       (/^[^\s]+\.[^\s]{2,}/.test(v) && v.indexOf(' ') === -1);
    if (looksLikeUrl) location.href = /^[a-z]+:/i.test(v) ? v : ('https://' + v);
    else location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
  }
</script>
</body>
</html>

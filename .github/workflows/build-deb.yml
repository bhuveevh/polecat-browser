name: Build Debian package

# Builds Polecat Browser and produces polecat-browser_<version>_amd64.deb.
#
# Runs inside a Debian 12 (bookworm) container, so the resulting .deb is
# compiled against Debian 12's Qt 6.4 and installs cleanly on bookworm.
#
# How to get the .deb:
#   * Actions tab -> "Build Debian package" -> a run -> Artifacts -> download
#   * or push a tag like v1.0.0 and grab it from the auto-created Release.

on:
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    tags:
      - 'v*'                    # e.g. v1.0.0

permissions:
  contents: write               # needed to attach the .deb to a Release on tags

jobs:
  build-deb:
    name: Build .deb on Debian 12
    runs-on: ubuntu-latest
    container: debian:bookworm

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-webengine-dev \
            qt6-tools-dev \
            libqt6sql6-sqlite \
            libqt6svg6 \
            file

      - name: Configure (CMake, Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLECAT_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package the .deb with CPack
        run: |
          cd build
          cpack -G DEB
          ls -la polecat-browser_*.deb

      - name: Upload the .deb as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: polecat-browser-deb
          path: build/polecat-browser_*.deb
          if-no-files-found: error

      - name: Attach the .deb to a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/polecat-browser_*.deb
